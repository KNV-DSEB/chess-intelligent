name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chess_intelligent
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chess_intelligent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chess:chess@localhost:5432/chess_intelligent
      TEST_DATABASE_URL: postgresql://chess:chess@localhost:5432/chess_intelligent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build
