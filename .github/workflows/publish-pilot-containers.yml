name: publish pilot containers

on:
  push:
    tags:
      - 'pilot-001-rc*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-pilot-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/knv-dseb/chess-intelligent-api
  WORKER_IMAGE: ghcr.io/knv-dseb/chess-intelligent-worker

jobs:
  publish:
    if: github.repository == 'KNV-DSEB/chess-intelligent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable Pilot tag checkout
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          [[ "${GITHUB_REF_NAME}" == pilot-001-rc* ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive API image metadata
        id: api-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.API_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish API image
        id: api-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}

      - name: Derive Worker image metadata
        id: worker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.WORKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and publish Worker image
        id: worker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}

      - name: Report immutable image references
        shell: bash
        env:
          API_DIGEST: ${{ steps.api-build.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker-build.outputs.digest }}
        run: |
          [[ "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${WORKER_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          API_REFERENCE="${API_IMAGE}@${API_DIGEST}"
          WORKER_REFERENCE="${WORKER_IMAGE}@${WORKER_DIGEST}"
          echo "::notice title=API image::${API_REFERENCE}"
          echo "::notice title=Worker image::${WORKER_REFERENCE}"
          {
            echo '## Immutable Pilot container images'
            echo
            echo "- API: \`${API_REFERENCE}\`"
            echo "- Worker: \`${WORKER_REFERENCE}\`"
            echo "- Release: \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
